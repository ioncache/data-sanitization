name: CI (root)

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'tsconfig.json'
      - '.markdownlint.json'
      - '.markdownlintignore'
      - 'lint-staged.config.mjs'
      - '*.md'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/ci-data-sanitization.yml'
      - '!.github/workflows/ci-data-sanitization-log-providers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'tsconfig.json'
      - '.markdownlint.json'
      - '.markdownlintignore'
      - 'lint-staged.config.mjs'
      - '*.md'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/ci-data-sanitization.yml'
      - '!.github/workflows/ci-data-sanitization-log-providers.yml'

jobs:
  ci-root:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn lint:ci
